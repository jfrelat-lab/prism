name: gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every gate, on a fresh clone: no corpus, no game data, no gcc container. The gates that need
      # one of those say SKIP (exit 77) and do not fail the run; the others replay committed goldens.
      - run: node tools/gates.mjs --jobs=2
