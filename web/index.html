<!doctype html>
<!--
  PRISM — the browser shell.

  A generic host: it compiles C to JavaScript in a worker, shows the running program on one surface
  (a text screen until the program creates a display, its framebuffer afterwards), and forwards
  keystrokes as PC scan codes. It contains no knowledge of any particular program — those are data,
  in web/programs/*.json and web/machines.json, fetched at start-up.

  WHAT THE SHELL IS SHAPED LIKE, and why. A session is a MACHINE — DOS, Linux, SUN, Windows — and
  you pick a machine before you pick a program, because that is the choice the compiler actually
  makes: `quake:dos`, `quake:x11`, `quake:sun` and `quake:win` are four platform layers over one
  engine, and until this page had machines in it that choice was a dropdown labelled "host" that
  meant nothing to anybody. The chrome around the screen is a VM window; everything inside it is the
  guest's own decade, presented the way that machine presented programs: a DIR listing, an `ls -l`,
  an OpenWindows console, a desktop with icons.

  ONE PROGRAM PER SESSION, which is a fact rather than a rule: `prog.run()` never returns, so the
  worker holds exactly one program from the moment it starts.

  Serve it with `node tools/serve.mjs`: SharedArrayBuffer needs COOP/COEP headers, and the guest's
  memory being shared is what lets the page paint while the guest's own main loop never yields.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PRISM</title>
<script src="./coi.js"></script>
<style>
  :root {
    --bg: #0e1013; --panel: #171a1f; --panel-2: #1f242c; --edge: #262b33;
    --fg: #d7dae0; --dim: #8b929e; --accent: #6cb6ff;
    --warn: #e3b341; --err: #f28b82; --ok: #7ee2a8;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-size: 13px;
         display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }

  /*
   * The header does NOT wrap. It used to, and in a narrow window it grew to four or five lines and
   * ate the height the game was supposed to get -- the picture came out as a forty-pixel strip. One
   * row that scrolls sideways keeps its height fixed whatever the window does, so `main` always gets
   * the rest.
   */
  header { display: flex; gap: 10px; align-items: center; flex-wrap: nowrap; overflow-x: auto;
           padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  header > * { flex: none; }
  header .name { font-weight: 700; letter-spacing: .16em; color: var(--accent); }
  header .name small { display: block; font-weight: 400; letter-spacing: 0;
                       color: var(--dim); font-size: 10px; }
  .sep { flex: 1; }
  header a { color: var(--dim); text-decoration: none; border: 1px solid var(--edge);
             border-radius: 5px; padding: 5px 9px; }
  header a:hover { color: var(--accent); border-color: var(--accent); }
  /* The bar every PRISM page shares (index.html, web/, web/live/): the name is the way home, and the
     prism's spectrum under it. border-image rather than a pseudo-element, because the bar scrolls. */
  header { border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, #ff6b6b, #ffb35c, #ffe066, #7ee2a8, #6cb6ff, #9b8cff, #d38cff) 1; }
  /* The visitor's own data (web/app.js pickData): a panel over the screen, asking for the folder. */
  .byo { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; padding: 24px;
         background: rgba(14, 16, 19, .92); color: var(--fg); text-align: center; z-index: 5; }
  .byo p { max-width: 52ch; margin: 0; line-height: 1.55; }
  .byo b { color: var(--accent); }
  .byo-actions { display: flex; gap: 10px; justify-content: center; }
  .byo button { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--edge);
                border-radius: 5px; padding: 6px 12px; cursor: pointer; }
  .byo button.byo-pick, .byo button.byo-zip { border-color: var(--accent); color: var(--accent); }
  .byo.over { outline: 3px dashed var(--accent); outline-offset: -12px; }
  .byo .byo-err { color: #ff8a80; }
  .byo .byo-keep { font-size: 13px; color: var(--dim); display: flex; gap: 6px; justify-content: center; align-items: center; }
  .byo .byo-keep { font-size: 13px; color: var(--dim, #9aa4b2); display: flex; gap: 6px; justify-content: center; align-items: center; }
  header a.name { border: none; padding: 0; border-radius: 0; color: var(--fg); text-decoration: none; }
  header a.name:hover { color: var(--accent); }
  header .name .mark { color: var(--accent); }

  /* ---------------------------------------------------------------- the machines */
  /*
   * A rail of machines, and the one you are in is lit. The dot is a VM manager's state light rather
   * than decoration: it says which machine this page IS, which matters because everything below --
   * the program list, the icons, the arguments -- belongs to that machine and to no other.
   */
  #machines { display: flex; gap: 6px; }
  .machine { display: grid; gap: 2px; text-align: left; cursor: pointer; font: inherit;
             background: var(--panel-2); border: 1px solid var(--edge); border-radius: 7px;
             padding: 6px 11px 7px; color: var(--fg); }
  .machine:hover { border-color: var(--accent); }
  .machine[aria-selected="true"] { border-color: var(--accent); background: #1d2a38; }
  .machine .mname { display: flex; align-items: center; gap: 6px; font-weight: 600;
                    letter-spacing: .04em; }
  .machine .dot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--dim);
                  flex: none; }
  .machine[aria-selected="true"] .dot { background: var(--accent); border-color: var(--accent); }
  .machine .msub { font-size: 10px; color: var(--dim); }

  select, button, input { font: inherit; color: var(--fg);
    background: var(--panel-2); border: 1px solid var(--edge); border-radius: 5px; padding: 5px 9px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #args { width: 24ch; }
  #run { border-color: #2f6f4f; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }

  main { display: grid; grid-template-columns: 1fr minmax(290px, 32%); min-height: 0; }
  /*
   * A narrow window must not squeeze the game into a sliver. The side panel has a 290px floor, so
   * below roughly 900px the canvas column collapses to almost nothing and the game becomes a
   * thumbnail beside a full-height log -- which reads as the display being broken rather than as a
   * layout that ran out of room. Stack instead.
   */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); }
    aside { border-left: none; border-top: 1px solid var(--edge); }
  }

  /* ---------------------------------------------------------------- the VM window */
  /*
   * Two rows: the VM's title strip and its screen. There used to be two more under it -- a caption
   * naming the selected program and a row of data-file controls -- and both were the shell talking
   * over the machine. The machine says what it has in its own listing, and a program's data now
   * arrives with the program.
   */
  #vm { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; padding: 10px; }
  .vmtop { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; overflow-x: auto;
           background: var(--panel); border: 1px solid var(--edge); border-bottom: none;
           border-radius: 8px 8px 0 0; padding: 7px 10px; }
  .vmtop > * { flex: none; }
  .vmtop .vmname { font-weight: 700; letter-spacing: .06em; }
  .pill { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
          border: 1px solid var(--edge); border-radius: 99px; padding: 3px 8px; }
  .pill.on { color: var(--ok); border-color: #2f6f4f; }
  .vmspec { color: var(--dim); font-size: 11px; }

  #stage { display: grid; place-items: center; min-height: 0; overflow: hidden;
           background: #000; position: relative; border: 1px solid var(--edge);
           border-radius: 0 0 8px 8px; }
  /* The pointer is the program's while it is captured; say so, because Esc is how you get it back. */
  #stage.captured { cursor: none; box-shadow: inset 0 0 0 1px var(--accent); }
  /*
   * `object-fit: contain` rather than `height: 100%; width: auto`: the old rule scaled to the
   * stage's HEIGHT and let the width follow, which needs the stage to have a definite height -- and
   * when it does not, the canvas collapses to its intrinsic size or smaller. OpenDUNE came out at
   * 86x54 from a 320x200 buffer.
   */
  #screen { image-rendering: pixelated; width: 100%; height: 100%; object-fit: contain;
            background: #000; }
  /*
   * A FLEX ITEM WILL NOT SHRINK BELOW ITS CONTENT, and a canvas's content has an aspect ratio.
   *
   * The frame is a flex column; `height: 100%` on the canvas resolved against it, but the default
   * `min-height: auto` then refused to go below the height its own 320x200 ratio implies at that
   * width. In a wide, short window that is bigger than the stage: measured 581px of canvas inside a
   * 371px stage, and `overflow: hidden` cut the top and bottom off the picture. The letterboxing was
   * never wrong -- there was simply nothing left of the box to letterbox inside.
   *
   * `flex: 1 1 0` with the minimums released makes the canvas exactly the space that is left, and
   * `object-fit: contain` then fits the guest's resolution into it and centres it, at any window
   * size, on every resize, with black where the shape does not match.
   */
  #winframe:not(.windowed) > #screen { flex: 1 1 0; min-width: 0; min-height: 0; }
  /*
   * The stage holds two things, and which of them shows is not "is something running" -- it is WHAT
   * KIND OF MACHINE this is. A terminal machine is the canvas the whole time: its prompt is drawn in
   * the same 80x25 text mode the program will use, so nothing moves or rescales when the program
   * starts. A DESKTOP is the other way round: the desktop stays, and a program that runs on it opens
   * a WINDOW over the icons -- which is what the icons are for. Hiding the desktop the moment
   * something ran made the machine disappear at exactly the moment it became a machine.
   */
  #stage:not(.desktop) #chooser { display: none; }
  #stage.desktop #winframe { z-index: 2; }
  /* On a desktop the canvas is only ever a window; without one there is nothing to show yet. */
  #stage.desktop #winframe:not(.windowed) { display: none; }
  #stage.desktop #winframe:not(.windowed) { width: auto; height: auto; }

  /*
   * A window, when the program has one. Win32 Quake owns this rectangle: it sizes it when the
   * resolution changes and reads back where it sits, so the frame here is positioned FROM the guest
   * and dragging it writes back INTO the guest rather than moving a div and telling nobody.
   *
   * The frame is ALWAYS the canvas's parent and only sometimes a window. It used to carry the chrome
   * unconditionally and be switched off with the `hidden` attribute -- which does nothing here,
   * because `#winframe { display: flex }` outranks the user agent's `[hidden] { display: none }`. So
   * a title bar reading "WinQuake" sat over every program. `.windowed` is the switch.
   */
  #winframe { display: flex; flex-direction: column; max-width: 100%; max-height: 100%; }
  /*
   * A frame that is NOT a window fills the stage, so the canvas's own `object-fit: contain` has a
   * box to letterbox inside. Without this the wrapper shrank to the canvas's intrinsic size and a
   * 320x200 game sat as a postage stamp in the middle of a 900-pixel stage -- which reads as the
   * scaler being broken and is really a flex item that was never told to grow.
   */
  #winframe:not(.windowed) { width: 100%; height: 100%; }
  #winframe.windowed { position: absolute; left: 0; top: 0; border: 2px outset #b8b8b8;
                       background: #b8b8b8; box-shadow: 2px 2px 6px #0008; }
  #wintitle { display: none; }
  #winframe.windowed #wintitle { display: flex; align-items: center; gap: 6px; padding: 2px 3px;
              cursor: move; background: linear-gradient(90deg, #000080, #1084d0); color: #fff;
              font: bold 12px/1.4 system-ui, sans-serif; user-select: none; }
  #wincaption { flex: 1; padding-left: 3px; }
  #winclose { border: 1px outset #d4d0c8; background: #d4d0c8; color: #000; cursor: pointer;
              font: bold 10px/1 system-ui, sans-serif; width: 18px; height: 16px; padding: 0; }
  #winclose:active { border-style: inset; }
  #winframe #screen { display: block; }
  /* On a Unix machine the window manager is an X one, drawn as twm drew its frames: plain, black on light. */
  #stage[data-kind="unix"] #winframe.windowed { border: 1px solid #000; background: #fff; box-shadow: 3px 3px 0 #0006; }
  #stage[data-kind="unix"] #winframe.windowed #wintitle { background: #fff; color: #000; border-bottom: 1px solid #000;
              font: bold 12px/1.4 ui-monospace, monospace; }
  #stage[data-kind="unix"] #winclose { border: 1px solid #000; background: #fff; width: 14px; height: 14px; }

  /*
   * Fullscreen: the STAGE goes fullscreen rather than the canvas, because a fullscreened canvas is
   * stretched to the monitor by the browser -- a 320x200 frame on a 16:9 screen then comes out wrong
   * in both directions.
   */
  #stage:fullscreen { display: flex; align-items: center; justify-content: center;
                      width: 100vw; height: 100vh; background: #000; }
  #stage:fullscreen #screen { width: 100vw; height: 100vh; object-fit: contain; }

  /* ---------------------------------------------------------------- the chooser */
  /*
   * WHAT THE MACHINE LOOKS LIKE BEFORE ANYTHING RUNS. Not a menu wearing the machine's colours: the
   * machine itself. A terminal machine draws its prompt ON THE CANVAS, in the same 80x25 text mode
   * the program will use -- see web/app.js -- so there is no CSS for it here at all, and nothing
   * moves or rescales when a program starts. Only a desktop needs DOM, because it is a GUI.
   */
  #chooser { position: absolute; inset: 0; overflow: auto; }

  /* The Windows desktop: icons in a ROW, left to right, the way a desktop lays them out. */
  .desktop { position: absolute; inset: 0; background: #3a6e6e;
             display: flex; flex-direction: column; }
  .icons { flex: 1; padding: 16px; display: flex; flex-direction: row; flex-wrap: wrap;
           align-items: flex-start; align-content: flex-start; gap: 10px 6px; min-height: 0;
           overflow: auto; }
  .shortcut { width: 104px; padding: 8px 4px 6px; border: 1px dotted transparent; cursor: pointer;
              background: none; color: #fff; font: 400 12px/1.35 system-ui, sans-serif;
              display: grid; justify-items: center; gap: 6px; text-align: center; }
  .shortcut img { width: 32px; height: 32px; image-rendering: pixelated; }
  .shortcut span { text-shadow: 1px 1px 0 rgba(0,0,0,.65); }
  .shortcut:hover { border-color: rgba(255,255,255,.55); }
  .shortcut[aria-selected="true"] { border-color: #fff; background: rgba(0,0,90,.45); }
  .shortcut.absent { opacity: .45; cursor: default; }
  .taskbar { background: #c0c0c0; border-top: 2px solid #dfdfdf; padding: 3px 4px; display: flex;
             gap: 6px; align-items: center; font: 400 12px/1 system-ui, sans-serif; color: #000; }
  .taskbar .start { border: 2px solid; border-color: #fff #808080 #808080 #fff;
                    padding: 4px 10px 4px 8px; font-weight: 700; display: flex; gap: 5px;
                    align-items: center; }
  .taskbar .flag { width: 12px; height: 12px;
    background:
      linear-gradient(135deg, #e33 0 50%, transparent 0) 0 0/7px 7px no-repeat,
      linear-gradient(135deg, #2a2 0 50%, transparent 0) 6px 0/7px 7px no-repeat,
      linear-gradient(135deg, #2af 0 50%, transparent 0) 0 6px/7px 7px no-repeat,
      linear-gradient(135deg, #fc2 0 50%, transparent 0) 6px 6px/7px 7px no-repeat; }
  .taskbar .task { border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 4px 10px;
                   flex: 0 1 240px; text-align: left; }
  .taskbar .tray { margin-left: auto; border: 2px solid;
                   border-color: #808080 #fff #fff #808080; padding: 4px 8px;
                   font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------------- under the screen */

  /*
   * PRISM'S OWN PANEL, and nothing else's.
   *
   * It used to carry three things: a status line, a legend of the game's keys, and the program's
   * stdout. The legend belonged to a shell where you picked a program from a dropdown and had no
   * idea what it was; the machine's own screen tells you that now. And the program's output belongs
   * to the program: it is on the machine's terminal, where the person typing can see it, and in the
   * browser's console for anyone who wants to grep it. What is left here is what PRISM has to say
   * about ITSELF -- what it fetched, what it compiled, what it could not emit -- which is a different
   * kind of thing and is why the panel can be closed.
   */
  aside { border-left: 1px solid var(--edge); display: grid; grid-template-rows: auto 1fr;
          min-height: 0; background: var(--panel); }
  main.nopanel { grid-template-columns: 1fr; }
  main.nopanel aside { display: none; }
  /* The player (web/app.js PLAYER): the program's screen and its own controls, nothing of the shelf. */
  .playeronly { display: none; }
  /* Inside Live C's frame (?live=1) the editor's page is the header: the program's bar and screen only. */
  body.live > header { display: none; }
  body.live { grid-template-rows: minmax(0, 1fr); }
  body.player .playeronly { display: inline-block; }
  body.player #machines, body.player header a[href^="./"]:not(.playeronly), body.player aside,
  body.player #panel, body.player #vmSpec, body.player #vmState, body.player .vmtop label:not(.keepin) { display: none !important; }
  /* One row too: the narrow layout's second row was the side panel's, hidden here, and kept 2/5 of the height. */
  body.player main { grid-template-columns: 1fr !important; grid-template-rows: minmax(0, 1fr) !important; }
  /* A desktop in the player holds the one program it was opened for. */
  body.player .desktop .shortcut[aria-selected="false"] { display: none; }
  body.player #vmName { font-weight: 600; }
  #playerr { position: absolute; inset: auto 16px 16px 16px; z-index: 6; padding: 12px 14px; border-radius: 6px;
             background: rgba(60, 14, 14, .95); border: 1px solid #ff8a80; color: var(--fg); font-size: 13px; }
  #playerr p { margin: 0 0 4px; } #playerr a { color: #ffb4ab; }
  .bar { padding: 8px 12px; border-bottom: 1px solid var(--edge); color: var(--dim);
         display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #stats { color: var(--fg); }

  #log { overflow-y: auto; padding: 8px 12px; min-height: 0; }
  .line { white-space: pre-wrap; word-break: break-word; margin: 1px 0; color: var(--dim); }
  .line.warn { color: var(--warn); }
  .line.error { color: var(--err); }
</style>
</head>
<body>

<header>
  <a class="name" href="../" title="PRISM: the project page"><span class="mark">◢</span> PRISM<small>C &rarr; JavaScript</small></a>
  <div id="machines" role="tablist" aria-label="Machines"></div>
  <span class="sep"></span>
  <a href="./mame/" data-server title="MAME 0.34 game by game: which start, which are held to a native build, a screenshot of each">MAME games &rarr;</a>
  <a href="./live/" title="write C and run it, with no machine and no program">Live C &rarr;</a>
  <a id="toShelf" class="playeronly" href="./" title="the same program in the shelf: its arguments, PRISM's log, the other machines">Open in the shelf &rarr;</a>
</header>

<main id="main-panel-host">
  <div id="vm">
    <div class="vmtop">
      <span class="vmname" id="vmName">&mdash;</span>
      <span class="pill" id="vmState">powered on</span>
      <span class="vmspec" id="vmSpec"></span>
      <span class="sep"></span>
      <label>args <input id="args" type="text" spellcheck="false"></label>
      <button id="run">Run</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="pause">Pause</button>
      <button id="fullscreen" title="fill the screen — Esc or F11 to come back">Fullscreen</button>
      <button id="panel" title="PRISM's own messages — the program's output is on its screen and in the browser console">Log</button>
      <label class="keepin" title="positions: a key is where it is on a US keyboard, as games expect (W A S D, 1-8). your layout: what your keyboard types on it, for typing text -- as on a real machine set to your language. Takes effect at the next Run.">keys
        <select id="keys">
          <option value="positions" selected>positions</option>
          <option value="typed">your layout</option>
        </select>
      </label>
      <label>speed
        <select id="speed">
          <option value="25">25%</option>
          <option value="50">50%</option>
          <option value="100" selected>100%</option>
          <option value="200">200%</option>
          <option value="0">unlimited</option>
        </select>
      </label>
    </div>

    <div id="stage">
      <div id="chooser"></div>
      <div id="winframe">
        <!-- The caption is the PROGRAM's: CreateWindowEx gives it, and until one does there is no
             window and no title. It said "WinQuake" here, which is how one game's title came to sit
             over every other program in the picker. -->
        <div id="wintitle"><span id="wincaption"></span><button id="winclose" title="close">&#10005;</button></div>
        <canvas id="screen" width="720" height="400"></canvas>
      </div>
    </div>

  </div>

  <aside>
    <div class="bar"><span id="stats">idle</span></div>
    <div id="log"></div>
  </aside>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
