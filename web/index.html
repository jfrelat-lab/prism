<!doctype html>
<!--
  PRISM — the browser shell.

  A generic host: it compiles C to JavaScript in a worker, shows the running program on one surface
  (a text screen until the program creates a display, its framebuffer afterwards), and forwards
  keystrokes as PC scan codes. It contains no knowledge of any particular program — those are data,
  in web/programs/*.json, discovered at start-up.

  Serve it with `node tools/serve.mjs`: SharedArrayBuffer needs COOP/COEP headers, and the guest's
  memory being shared is what lets the page paint while the guest's own main loop never yields.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PRISM</title>
<style>
  :root {
    --bg: #0e1013; --panel: #171a1f; --edge: #262b33;
    --fg: #d7dae0; --dim: #8b929e; --accent: #6cb6ff;
    --warn: #e3b341; --err: #f28b82;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* Two rows, not three: hiding the data row with display:none removed it as a grid ITEM, so
     `main` inherited the second `auto` track and stopped filling the window. */
  body { margin: 0; background: var(--bg); color: var(--fg); font-size: 13px;
         display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }

  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
           padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  header .name { font-weight: 700; letter-spacing: .16em; color: var(--accent); }
  header .name small { display: block; font-weight: 400; letter-spacing: 0;
                       color: var(--dim); font-size: 10px; }
  .sep { flex: 1; }

  #dataRow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
             padding: 7px 14px; background: #13161a; border-bottom: 1px solid var(--edge);
             color: var(--dim); }

  select, button, input { font: inherit; color: var(--fg);
    background: #1f242c; border: 1px solid var(--edge); border-radius: 5px; padding: 5px 9px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #args { width: 22ch; }
  #run { border-color: #2f6f4f; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  #subtitle { color: var(--dim); }

  main { display: grid; grid-template-columns: 1fr minmax(290px, 32%); min-height: 0; }

  #stage { display: grid; place-items: center; padding: 12px; min-height: 0; overflow: hidden;
           background: #000; }
  /* The guest decides the resolution; the canvas is scaled with no smoothing, because a 224x288
     arcade framebuffer interpolated to fit looks like a different program. */
  #screen { image-rendering: pixelated; max-width: 100%; max-height: 100%;
            width: auto; height: 100%; background: #000; }

  aside { border-left: 1px solid var(--edge); display: grid; grid-template-rows: auto auto 1fr;
          min-height: 0; background: var(--panel); }
  .bar { padding: 8px 12px; border-bottom: 1px solid var(--edge); color: var(--dim);
         display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #stats { color: var(--fg); }
  kbd { background: #222831; border: 1px solid var(--edge); border-bottom-width: 2px;
        border-radius: 4px; padding: 0 5px; color: var(--fg); }

  #log { overflow-y: auto; padding: 8px 12px; min-height: 0; }
  .line { white-space: pre-wrap; word-break: break-word; margin: 1px 0; color: var(--dim); }
  .line.warn { color: var(--warn); }
  .line.error { color: var(--err); }
</style>
</head>
<body>

<div class="chrome">
<header>
  <span class="name">PRISM<small>C &rarr; JavaScript</small></span>
  <select id="program"></select>
  <label>args <input id="args" type="text" spellcheck="false"></label>
  <button id="run">Run</button>
  <button id="stopBtn" disabled>Stop</button>
  <button id="pause">Pause</button>
  <label>speed
    <select id="speed">
      <option value="25">25%</option>
      <option value="50">50%</option>
      <option value="100" selected>100%</option>
      <option value="200">200%</option>
      <option value="0">unlimited</option>
    </select>
  </label>
  <span class="sep"></span>
  <span id="subtitle"></span>
</header>

<div id="dataRow">
  <span>data files</span>
  <input type="file" id="data" multiple>
  <button id="loadServer" title="load the directory passed to serve.mjs --data=">from --data</button>
  <span id="dataNote"></span>
</div>
</div>

<main>
  <div id="stage"><canvas id="screen" width="720" height="400"></canvas></div>
  <aside>
    <div class="bar"><span id="stats">idle</span></div>
    <div class="bar" id="controls"></div>
    <div id="log"></div>
  </aside>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
