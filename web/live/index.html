<!doctype html>
<!--
  PRISM — Live C.

  The other half of the shell, and deliberately a SEPARATE page. web/ runs programs that already
  exist: you choose a machine, the machine shows you what is on it, and a corpus of 1990s C is
  fetched and compiled. This page has no machine and no corpus. You type C, and it runs.

  What it is for: the claim PRISM makes is about the C language and about libc, and every program in
  the shelf demonstrates that claim wrapped in fifty thousand lines of somebody else's engine. Thirty
  lines you wrote yourself demonstrate it in a second, and — because the same compiler runs both —
  a defect found here is reproducible in a form small enough to fix.

  It shares the compiler, the libc, the control block and the keyboard queue with the shell. It does
  not share the platform layers, because there is no platform: no framebuffer, no devices, no clock.

  Serve it with `node tools/serve.mjs`, at /web/live/. SharedArrayBuffer needs COOP/COEP, and stdin
  needs SharedArrayBuffer: `prog.run()` never returns, so a keystroke posted as a message would
  arrive at a worker whose event loop has stopped.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PRISM · Live C</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../coi.js"></script>
<style>
  :root {
    --bg: #0e1013; --panel: #171a1f; --panel-2: #1f242c; --edge: #262b33;
    --fg: #d7dae0; --dim: #8b929e; --accent: #6cb6ff;
    --warn: #e3b341; --err: #f28b82; --ok: #7ee2a8;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-size: 13px;
         display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }

  header { display: flex; gap: 10px; align-items: center; flex-wrap: nowrap; overflow-x: auto;
           padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  header > * { flex: none; }
  header .name { font-weight: 700; letter-spacing: .16em; color: var(--accent); }
  header .name small { display: block; font-weight: 400; letter-spacing: 0;
                       color: var(--dim); font-size: 10px; }
  .sep { flex: 1; }
  /* The bar every PRISM page shares (index.html, web/, web/live/): the name is the way home, and the
     prism's spectrum under it. border-image rather than a pseudo-element, because the bar scrolls. */
  header { border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, #ff6b6b, #ffb35c, #ffe066, #7ee2a8, #6cb6ff, #9b8cff, #d38cff) 1; }
  header a.name { border: none; padding: 0; border-radius: 0; color: var(--fg); text-decoration: none; }
  header a.name:hover { color: var(--accent); }
  header .name .mark { color: var(--accent); }
  a.back { color: var(--dim); text-decoration: none; border: 1px solid var(--edge);
           border-radius: 5px; padding: 5px 9px; }
  a.back:hover { color: var(--accent); border-color: var(--accent); }

  select, button, input { font: inherit; color: var(--fg); background: var(--panel-2);
    border: 1px solid var(--edge); border-radius: 5px; padding: 5px 9px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #run { border-color: #2f6f4f; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  #argv { width: 18ch; }

  main { display: grid; grid-template-columns: 1fr minmax(300px, 40%); min-height: 0; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .right { border-left: none; border-top: 1px solid var(--edge); }
  }

  /* ---------------------------------------------------------------- the editor */
  .left { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .tabs { display: flex; gap: 2px; align-items: stretch; padding: 6px 8px 0;
          background: var(--panel); border-bottom: 1px solid var(--edge);
          overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 6px; border: 1px solid var(--edge);
         border-bottom: none; border-radius: 6px 6px 0 0; padding: 6px 10px;
         background: var(--panel-2); color: var(--dim); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--bg); color: var(--fg); border-color: var(--accent); }
  .tab .x { color: var(--dim); border: none; background: none; padding: 0 2px; font-size: 11px; }
  .tab .x:hover { color: var(--err); }
  .tabs .add { border-style: dashed; }

  /*
   * A textarea, and not a syntax-highlighting editor.
   *
   * Highlighting means either a library from a CDN or a second, approximate C lexer beside the real
   * one -- and PRISM already HAS a C lexer, whose answers matter. A wrong colour from a toy lexer in
   * the page that compiles C for a living is worse than no colour at all. Tab inserts a tab, the
   * caret goes where you clicked, and everything else is the browser's.
   */
  #editor { width: 100%; height: 100%; resize: none; border: none; border-radius: 0;
            background: var(--bg); color: var(--fg); padding: 12px 14px;
            font: 400 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
            tab-size: 4; white-space: pre; overflow: auto; }
  #editor:focus { outline: none; }

  /* ---------------------------------------------------------------- output */
  .right { border-left: 1px solid var(--edge); background: var(--panel);
           display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
  .obar { display: flex; gap: 8px; align-items: center; padding: 7px 12px;
          border-bottom: 1px solid var(--edge); color: var(--dim); }
  .obar .which { display: flex; gap: 2px; }
  .obar .which button { padding: 3px 9px; font-size: 12px; }
  .obar .which button[aria-selected="true"] { border-color: var(--accent); color: var(--fg); }
  #status { margin-left: auto; color: var(--fg); }
  #panes { overflow: auto; min-height: 0; padding: 10px 12px; }
  #out { white-space: pre-wrap; word-break: break-word; margin: 0; }
  #emitted { white-space: pre; margin: 0; color: var(--dim); font-size: 12px; }
  .note { color: var(--dim); }
  .note.warn { color: var(--warn); }
  .note.err { color: var(--err); }
  .note.ok { color: var(--ok); }
  .stdin { display: flex; gap: 8px; align-items: center; padding: 7px 12px;
           border-top: 1px solid var(--edge); }
  .stdin input { flex: 1; }
</style>
</head>
<body>

<header>
  <a class="name" href="../../" title="PRISM: the project page"><span class="mark">◢</span> PRISM<small>Live C</small></a>
  <button id="run">Run</button>
  <button id="stopBtn" disabled>Stop</button>
  <label>argv <input id="argv" type="text" spellcheck="false" value="prog"></label>
  <label>example
    <select id="examples"></select>
  </label>
  <label title="how each compiled file is read: by its name (.c is C; .cpp, .cc and .cxx are C++), or all of them as one language">language
    <select id="language">
      <option value="">by file name</option>
      <option value="c">C</option>
      <option value="c++">C++ (98)</option>
    </select>
  </label>
  <button id="reset" title="throw away these files and start from the example">Reset</button>
  <span class="sep"></span>
  <a class="back" href="../" id="shelfLink" hidden>Programs &rarr;</a>
</header>

<main>
  <div class="left">
    <div class="tabs" id="tabs"></div>
    <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
              wrap="off"></textarea>
  </div>

  <div class="right">
    <div class="obar">
      <span class="which">
        <button id="tabOut" aria-selected="true">Output</button>
        <button id="tabEmitted">Emitted JS</button>
      </span>
      <span id="status">idle</span>
    </div>
    <div id="panes">
      <pre id="out"></pre>
      <pre id="emitted" hidden></pre>
    </div>
    <div class="stdin">
      <label for="stdin">stdin</label>
      <input id="stdin" type="text" spellcheck="false"
             placeholder="typed here while the program runs — Enter sends the line">
    </div>
  </div>
</main>

<script type="module" src="./live.js"></script>
<script>
  // The shelf exists beside Live C under serve.mjs and in a static export (web/site.json), not on
  // GitHub Pages, where it would open on nothing: the link is offered only where it leads somewhere.
  Promise.any([fetch('../site.json'), fetch('/__targets')].map((p) => p.then((r) => (r.ok ? r : Promise.reject()))))
    .then(() => { document.getElementById('shelfLink').hidden = false; }).catch(() => {});
</script>
</body>
</html>
