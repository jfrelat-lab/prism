<!doctype html>
<!--
  PRISM — Live C.

  The other half of the shell, and deliberately a SEPARATE page. web/ runs programs that already
  exist: you choose a machine, the machine shows you what is on it, and a corpus of 1990s C is
  fetched and compiled. This page has no machine and no corpus. You type C, and it runs.

  What it is for: the claim PRISM makes is about the C language and about libc, and every program in
  the shelf demonstrates that claim wrapped in fifty thousand lines of somebody else's engine. Thirty
  lines you wrote yourself demonstrate it in a second, and — because the same compiler runs both —
  a defect found here is reproducible in a form small enough to fix.

  It shares the compiler, the libc, the control block and the keyboard queue with the shell. It does
  not share the platform layers, because there is no platform: no framebuffer, no devices, no clock.

  Serve it with `node tools/serve.mjs`, at /web/live/. SharedArrayBuffer needs COOP/COEP, and stdin
  needs SharedArrayBuffer: `prog.run()` never returns, so a keystroke posted as a message would
  arrive at a worker whose event loop has stopped.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PRISM · Live C</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../coi.js"></script>
<style>
  :root {
    --bg: #0e1013; --panel: #171a1f; --panel-2: #1f242c; --edge: #262b33;
    --fg: #d7dae0; --dim: #8b929e; --accent: #6cb6ff;
    --warn: #e3b341; --err: #f28b82; --ok: #7ee2a8;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-size: 13px;
         display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }

  header { display: flex; gap: 10px; align-items: center; flex-wrap: nowrap; overflow-x: auto;
           padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  header > * { flex: none; }
  header .name { font-weight: 700; letter-spacing: .16em; color: var(--accent); }
  header .name small { display: block; font-weight: 400; letter-spacing: 0;
                       color: var(--dim); font-size: 10px; }
  .sep { flex: 1; }
  /* The bar every PRISM page shares (index.html, web/, web/live/): the name is the way home, and the
     prism's spectrum under it. border-image rather than a pseudo-element, because the bar scrolls. */
  header { border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, #ff6b6b, #ffb35c, #ffe066, #7ee2a8, #6cb6ff, #9b8cff, #d38cff) 1; }
  header a.name { border: none; padding: 0; border-radius: 0; color: var(--fg); text-decoration: none; }
  header a.name:hover { color: var(--accent); }
  header .name .mark { color: var(--accent); }
  a.back { color: var(--dim); text-decoration: none; border: 1px solid var(--edge);
           border-radius: 5px; padding: 5px 9px; }
  a.back:hover { color: var(--accent); border-color: var(--accent); }

  select, button, input { font: inherit; color: var(--fg); background: var(--panel-2);
    border: 1px solid var(--edge); border-radius: 5px; padding: 5px 9px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #run { border-color: #2f6f4f; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  #argv { width: 18ch; }

  main { display: grid; grid-template-columns: 1fr minmax(300px, 40%); min-height: 0; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .right { border-left: none; border-top: 1px solid var(--edge); }
  }

  /* ---------------------------------------------------------------- the editor */
  /* A column, not a grid: the credit line comes and goes, and a hidden row would shift the editor into it. */
  .left { display: flex; flex-direction: column; min-height: 0; }
  .left > .edit { flex: 1 1 auto; }
  /* Whose code is open, when it is not PRISM's: a Rosetta Code solution's credit (web/live/rosetta.js). */
  #credit { padding: 5px 14px; font-size: 12px; color: var(--dim); background: var(--panel);
            border-bottom: 1px solid var(--edge); }
  #credit[hidden] { display: none; }
  #credit a { color: inherit; text-decoration: underline; }
  #credit b { color: var(--fg); font-weight: 500; }
  .tabs { display: flex; gap: 2px; align-items: stretch; padding: 6px 8px 0;
          background: var(--panel); border-bottom: 1px solid var(--edge);
          overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 6px; border: 1px solid var(--edge);
         border-bottom: none; border-radius: 6px 6px 0 0; padding: 6px 10px;
         background: var(--panel-2); color: var(--dim); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--bg); color: var(--fg); border-color: var(--accent); }
  .tab .x { color: var(--dim); border: none; background: none; padding: 0 2px; font-size: 11px; }
  .tab .x:hover { color: var(--err); }
  .tabs .add { border-style: dashed; }

  /*
   * A textarea, still: Tab inserts a tab, the caret goes where you clicked, and everything else is
   * the browser's. The colours are a <pre> UNDER it, painted from PRISM's own lexer
   * (web/live/highlight.js) -- not a library from a CDN, and not a second, approximate C lexer, whose
   * wrong colour in the page that compiles C for a living would be worse than none. The textarea's
   * text is transparent and its caret is not; the two share font, padding and scroll position, so the
   * coloured text sits exactly under the editable one.
   */
  .edit { position: relative; min-height: 0; background: var(--bg); }
  /* A Rosetta Code solution on its way: over the editor, which waits with the controls around it. */
  #loading { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
             gap: 10px; background: color-mix(in srgb, var(--bg) 82%, transparent); color: var(--fg); }
  #loading[hidden] { display: none; }
  #loading .spin { width: 14px; height: 14px; border: 2px solid var(--edge); border-top-color: var(--accent);
                   border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #loading .spin { animation-duration: 3s; } }
  #editor, #hl { position: absolute; inset: 0; margin: 0; border: none; padding: 12px 14px;
                 font: 400 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
                 tab-size: 4; white-space: pre; overflow: auto; }
  #hl { color: var(--fg); pointer-events: none; overflow: hidden; }
  #editor { width: 100%; height: 100%; resize: none; border-radius: 0; background: transparent;
            color: transparent; caret-color: var(--fg); }
  #editor::selection { background: rgba(108, 182, 255, .3); color: transparent; }
  #editor:focus { outline: none; }
  /* The editor's colours and the emitted JavaScript's: one palette for the two. */
  :is(#hl, #emitted) .k { color: #c792ea; }   /* keyword, as PRISM's parser reads it */
  :is(#hl, #emitted) .s { color: #a5d6a7; }   /* string, and an #include's header name */
  :is(#hl, #emitted) .c { color: #ffcc80; }   /* character constant */
  :is(#hl, #emitted) .n { color: #f78c6c; }   /* number */
  :is(#hl, #emitted) .m { color: #7a828f; font-style: italic; }   /* comment */
  :is(#hl, #emitted) .p { color: #82aaff; }   /* directive */

  /* ---------------------------------------------------------------- output */
  .right { border-left: 1px solid var(--edge); background: var(--panel);
           display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .obar { display: flex; gap: 8px; align-items: center; padding: 7px 12px;
          border-bottom: 1px solid var(--edge); color: var(--dim); }
  .obar .which { display: flex; gap: 2px; }
  .obar .which button { padding: 3px 9px; font-size: 12px; }
  .obar .which button[aria-selected="true"] { border-color: var(--accent); color: var(--fg); }
  #status { margin-left: auto; color: var(--fg); }
  #panes { overflow: auto; min-height: 0; padding: 10px 12px; }
  /*
   * THE TERMINAL: what the program writes, and what you type to it at the cursor -- echoed as you
   * type, sent a line at a time on Enter, as a terminal in its ordinary (cooked) mode does.
   */
  #out { white-space: pre-wrap; word-break: break-word; margin: 0; min-height: 100%; outline: none; }
  #out .typed { color: var(--accent); }
  #out .cursor { display: none; }
  #out.live .cursor { display: inline-block; width: .6em; height: 1.15em; vertical-align: text-bottom;
                      background: var(--fg); opacity: .35; }
  #out.live:focus .cursor { opacity: 1; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #out.live:focus .cursor { animation: none; } }
  #out .hint { color: var(--dim); }
  /* THE BUILD: what the compiler said -- units, time, what it could not emit, its errors. */
  #build { white-space: pre-wrap; word-break: break-word; margin: 0; }
  /* A program that needs a display runs in the shelf's player, framed here (see live.js). */
  #screen { height: 100%; min-height: 360px; }
  #screen iframe { width: 100%; height: 100%; min-height: 360px; border: 0; display: block; }
  #panes:has(#screen:not([hidden])) { padding: 0; overflow: hidden; }
  #emitted { white-space: pre; margin: 0; color: var(--dim); font-size: 12px; }
  #emitted summary { cursor: pointer; color: var(--accent); padding: 6px 0; white-space: normal; }
  .note { color: var(--dim); }
  .note.warn { color: var(--warn); }
  .note.err { color: var(--err); }
  .note.ok { color: var(--ok); }


  /* ---------------------------------------------------------------- the example picker */
  #pick #pickName { color: var(--fg); }
  #picker { position: fixed; z-index: 50; width: min(470px, calc(100vw - 16px)); max-height: 70vh;
            display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 6px; padding: 8px;
            background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .45); }
  /* `display: grid` above outranks the hidden attribute's own display: none, so it is said again. */
  #picker[hidden] { display: none; }
  .pickhead { display: flex; gap: 6px; }
  #pickSearch { flex: 1; min-width: 0; }
  #pickClose { padding: 0 9px; }
  #pickChips { display: flex; flex-wrap: wrap; gap: 4px; }
  #pickChips button { font-size: 12px; padding: 2px 9px; border-radius: 999px; }
  #pickChips button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #pickList { overflow: auto; min-height: 0; border-top: 1px solid var(--edge); }
  #pickList .pg { position: sticky; top: 0; background: var(--panel); color: var(--dim); font-size: 11px;
                  letter-spacing: .06em; padding: 6px 6px 3px; }
  #pickList .pg span { float: right; }
  #pickList .pi { display: flex; justify-content: space-between; align-items: center; gap: 8px;
                  padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  #pickList .pi > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pickList .pi:hover, #pickList .pi[aria-selected="true"] { background: var(--panel-2); }
  .tags { display: flex; gap: 4px; flex: none; }
  .tag { font-size: 10.5px; line-height: 1.5; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; }
  .tag.t-OpenGL { color: #82aaff; } .tag.t-SDL { color: #ffcc80; } .tag.t-Win32 { color: #7ee2a8; }
  .tag.t-X11 { color: #f78c6c; } .tag.t-C { color: #c792ea; } .tag.t-stdin { color: var(--dim); }
  #pickFoot { color: var(--dim); font-size: 11px; }
</style>
</head>
<body>

<header>
  <a class="name" href="../../" title="PRISM: the project page"><span class="mark">◢</span> PRISM<small>Live C</small></a>
  <button id="run">Run</button>
  <button id="stopBtn" disabled>Stop</button>
  <label>argv <input id="argv" type="text" spellcheck="false" value="prog"></label>
  <button id="pick" aria-haspopup="dialog" aria-expanded="false" title="PRISM's examples and Rosetta Code's, with what each needs">example: <span id="pickName">prism/hello.c</span> &#9662;</button>
  <label title="how each compiled file is read: by its name (.c is C; .cpp, .cc and .cxx are C++), or all of them as one language">language
    <select id="language">
      <option value="">by file name</option>
      <option value="c">C</option>
      <option value="c++">C++ (98)</option>
    </select>
  </label>
  <button id="reset" title="reload the open example as it was, discarding your changes">Reset</button>
  <span class="sep"></span>
  <a class="back" href="../" id="shelfLink" hidden>Programs &rarr;</a>
</header>

<main>
  <div class="left">
    <div class="tabs" id="tabs"></div>
    <div id="credit" hidden></div>
    <div class="edit">
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
                wrap="off"></textarea>
      <div id="loading" hidden role="status" aria-live="polite">
        <span class="spin" aria-hidden="true"></span><span id="loadingText">loading</span>
        <button id="loadingCancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="obar">
      <span class="which">
        <button id="tabOut" aria-selected="true">Output</button>
        <button id="tabBuild">Build</button>
        <button id="tabEmitted">Emitted JS</button>
      </span>
      <span id="status">idle</span>
    </div>
    <div id="panes">
      <pre id="out" tabindex="0" aria-label="Terminal: the program's output, and its input while it runs"></pre>
      <pre id="build" hidden></pre>
      <pre id="emitted" hidden></pre>
      <div id="screen" hidden></div>
    </div>
  </div>
</main>

<div id="picker" role="dialog" aria-label="Examples" hidden>
  <div class="pickhead">
    <input id="pickSearch" type="search" spellcheck="false" placeholder="search: mandelbrot, sort, window...">
    <button id="pickClose" type="button" title="close (Esc)" aria-label="Close">&times;</button>
  </div>
  <div id="pickChips" role="group" aria-label="Show"></div>
  <div id="pickList" role="listbox"></div>
  <div id="pickFoot"></div>
</div>

<script type="module" src="./live.js"></script>
<script>
  // The shelf exists beside Live C under serve.mjs and in a static export (web/site.json), not on
  // GitHub Pages, where it would open on nothing: the link is offered only where it leads somewhere.
  Promise.any([fetch('../site.json'), fetch('../../__targets')].map((p) => p.then((r) => (r.ok ? r : Promise.reject()))))
    .then(() => { document.getElementById('shelfLink').hidden = false; }).catch(() => {});
</script>
</body>
</html>
